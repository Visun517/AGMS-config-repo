server:
  port: 8082

# --- Local Laptop Settings ---
spring:
  application:
    name: sensor-service
  config:
    activate:
      on-profile: default

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

---
# --- Azure VM / Docker Settings ---
spring:
  config:
    activate:
      on-profile: prod

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/