# ==========================================
# 1.  (Local) Settings
# ==========================================
server:
  port: 8080

spring:
  config:
    activate:
      on-profile: default
  
  cloud:
    gateway:
      routes:
        - id: zone-service
          uri: lb://ZONE-SERVICE
          predicates:
            - Path=/api/zones/**
          filters:
            - AuthenticationFilter
        - id: sensor-service
          uri: lb://SENSOR-SERVICE
          predicates:
            - Path=/api/sensors/**
          filters:
            - AuthenticationFilter
        - id: automation-service
          uri: lb://AUTOMATION-SERVICE
          predicates:
            - Path=/api/automation/**
          filters:
            - AuthenticationFilter
        - id: crop-service
          uri: lb://CROP-SERVICE
          predicates:
            - Path=/api/crops/**
          filters:
            - AuthenticationFilter
        - id: identity-service
          uri: lb://IDENTITY-SERVICE
          predicates:
            - Path=/auth/**

  datasource:
    url: jdbc:mysql://localhost:3306/agms_db
    username: root
    password: Ijse@1234
    driver-class-name: com.mysql.cj.jdbc.Driver

jwt:
  secret: 5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

---
# ==========================================
# 2. Azure VM / Docker (Production) Settings
# ==========================================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://mysql-db:3306/agms_db
    username: root
    password: root

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
  instance:
    prefer-ip-address: true